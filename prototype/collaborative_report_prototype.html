<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>THROWAWAY｜處會週報協作排版 Prototype</title>
  <style>
    :root { font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif; color: #183047; background: #f3f6f7; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; border: 1px solid #c9d5df; background: #fff; color: #173650; border-radius: 9px; padding: 8px 12px; }
    button:hover { background: #edf4f8; }
    button.primary { color: #fff; border-color: #075c91; background: #08679f; }
    button.primary:hover { background: #075781; }
    button.quiet { border-color: transparent; background: transparent; }
    button.small { padding: 5px 9px; font-size: 12px; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid #91c9e8; outline-offset: 1px; }
    .topbar { height: 66px; display: flex; align-items: center; gap: 12px; padding: 0 20px; color: #fff; background: #102f47; position: sticky; top: 0; z-index: 10; }
    .topbar strong { font-size: 16px; white-space: nowrap; }
    .topbar .spacer { flex: 1; }
    .topbar button { border-color: #52758b; background: #21455e; color: #fff; }
    .topbar button.primary { background: #16907e; border-color: #16907e; }
    .topbar .tag { padding: 4px 8px; border: 1px solid #6f91a5; border-radius: 99px; font-size: 11px; white-space: nowrap; }
    .shell { min-height: calc(100vh - 66px); padding-bottom: 82px; }
    .subhead { display: flex; gap: 8px; align-items: center; padding: 11px 18px; background: #e5edf1; border-bottom: 1px solid #d1dfe6; font-size: 13px; }
    .subhead .spacer { flex: 1; }
    .muted { color: #668092; }
    .tiny { font-size: 12px; }
    .eyebrow { color: #42718a; font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
    .panel { background: #fff; border: 1px solid #d8e1e7; border-radius: 14px; box-shadow: 0 2px 8px #12304408; }
    .panel-header { display: flex; align-items: center; gap: 8px; padding: 15px 17px; border-bottom: 1px solid #e4ebef; }
    .panel-header h2, .panel-header h3 { margin: 0; font-size: 16px; }
    .panel-header .spacer { flex: 1; }
    .panel-body { padding: 17px; }
    .chip { display: inline-block; padding: 4px 8px; border-radius: 99px; background: #e8f4f4; color: #166a6d; font-size: 12px; white-space: nowrap; }
    .chip.warn { background: #fff1d8; color: #9c5d00; }
    .chip.blue { background: #e6effc; color: #315c9b; }
    .notice { padding: 10px 12px; border-radius: 9px; background: #fff6df; color: #775b16; font-size: 12px; line-height: 1.5; }
    .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px; background: #fff; border-bottom: 1px solid #dfe8ed; }
    .tabs button { flex: none; border-radius: 99px; }
    .tabs button.active { background: #173e5c; color: #fff; border-color: #173e5c; }
    .layout-a { display: grid; grid-template-columns: 248px minmax(0, 1fr) 310px; gap: 12px; padding: 12px; align-items: start; }
    .layout-a.no-nav { grid-template-columns: minmax(0, 1fr) 310px; }
    .layout-a.no-source { grid-template-columns: 248px minmax(0, 1fr); }
    .layout-a.no-nav.no-source { grid-template-columns: minmax(0, 1fr); }
    .layout-a .nav, .layout-a .source { position: sticky; top: 78px; max-height: calc(100vh - 94px); overflow: auto; }
    .nav-list { display: grid; gap: 5px; padding: 10px; }
    .nav-list button { border: 0; border-radius: 8px; text-align: left; background: transparent; width: 100%; }
    .nav-list button:hover, .nav-list button.active { background: #e9f2f7; color: #075c91; }
    .nav-list .indent { padding-left: 22px; font-size: 12px; }
    .layout-b { display: grid; grid-template-columns: minmax(0, 1fr); padding: 22px max(22px, calc((100vw - 1140px)/2)); }
    .layout-b.with-drawer { grid-template-columns: minmax(0, 1fr) minmax(390px, 42%); gap: 14px; padding: 16px; }
    .layout-b .report-paper { min-width: 0; }
    .layout-b .drawer { position: sticky; top: 80px; max-height: calc(100vh - 95px); overflow: auto; }
    .layout-c { padding: 15px; display: grid; gap: 13px; }
    .layout-c .board-top { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 13px; }
    .layout-c .board-bottom { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 13px; }
    .report-paper { background: #fff; box-shadow: 0 12px 35px #1830471a; padding: 35px 42px; border-radius: 4px; }
    .report-paper h1 { font-size: 26px; margin: 0 0 6px; }
    .report-paper h2 { font-size: 20px; margin: 34px 0 15px; border-bottom: 2px solid #a9becb; padding-bottom: 7px; }
    .report-paper h3 { font-size: 16px; margin: 22px 0 8px; }
    .report-paper p, .report-paper li { line-height: 1.62; }
    .report-paper .meta { color: #688093; font-size: 12px; }
    .report-card { border: 1px solid #dce5ea; border-left: 4px solid #2988a4; border-radius: 9px; padding: 15px; margin: 13px 0; }
    .report-card button { float: right; }
    .report-card .row { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
    .report-card .row h3 { margin: 0; flex: 1; }
    .report-card p { margin: 8px 0; }
    .report-card details { margin-top: 10px; }
    .report-card summary { color: #075c91; font-size: 12px; font-weight: 700; cursor: pointer; padding: 5px 0; }
    .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .field-grid .wide { grid-column: 1 / -1; }
    label { display: grid; gap: 6px; font-size: 12px; color: #526e80; font-weight: 700; }
    input, textarea, select { width: 100%; padding: 9px 10px; border: 1px solid #cbd9e1; border-radius: 8px; background: #fff; color: #193246; }
    textarea { min-height: 80px; resize: vertical; line-height: 1.5; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .toolbar .spacer { flex: 1; }
    .card-list { display: grid; gap: 9px; }
    .source-item { padding: 10px; border-bottom: 1px solid #e9eff2; font-size: 12px; line-height: 1.45; }
    .source-item:last-child { border: 0; }
    .source-item a { color: #0a6b9d; }
    .gantt-shell { overflow-x: auto; border: 1px solid #d5e2ea; border-radius: 10px; background: #fff; }
    .gantt-inner { min-width: 750px; }
    .gantt-line { display: grid; grid-template-columns: 185px minmax(550px, 1fr); min-height: 43px; border-bottom: 1px solid #edf2f4; }
    .gantt-line:last-child { border-bottom: 0; }
    .gantt-label { padding: 9px 11px; border-right: 1px solid #e4edf1; font-size: 12px; }
    .gantt-track { position: relative; background: repeating-linear-gradient(90deg, #fff 0, #fff calc(20% - 1px), #e9eff2 calc(20% - 1px), #e9eff2 20%); }
    .gantt-baseline, .gantt-forecast { position: absolute; height: 8px; border-radius: 4px; }
    .gantt-baseline { top: 10px; background: #a7b5bf; }
    .gantt-forecast { top: 23px; background: #2284ad; height: 11px; }
    .gantt-forecast.late { background: #e4a03b; }
    .gantt-milestone { position: absolute; top: 20px; width: 13px; height: 13px; transform: rotate(45deg); background: #197b89; border: 2px solid #fff; box-shadow: 0 0 0 1px #197b89; }
    .gantt-milestone.late { background: #dd9140; box-shadow: 0 0 0 1px #dd9140; }
    .gantt-legend { display: flex; gap: 12px; padding: 8px 12px; font-size: 11px; color: #547183; }
    .phase-form { border: 1px solid #d9e5eb; border-radius: 9px; padding: 11px; margin: 9px 0; }
    .phase-form strong { font-size: 13px; }
    .phase-form .field-grid { margin-top: 9px; }
    #switcher { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; padding: 8px; border-radius: 99px; background: #112d43; color: #fff; box-shadow: 0 8px 32px #0b253855; z-index: 30; }
    #switcher button { border: 0; border-radius: 99px; background: #2b526d; color: #fff; padding: 7px 12px; }
    #switcher span { min-width: 180px; text-align: center; font-size: 12px; }
    #previewOverlay { position: fixed; inset: 0; overflow: auto; background: #dce6eb; z-index: 25; }
    #previewOverlay .preview-tools { position: sticky; top: 0; z-index: 1; background: #14354d; color: #fff; display: flex; align-items: center; gap: 8px; padding: 9px 18px; }
    #previewOverlay .preview-tools .spacer { flex: 1; }
    #previewOverlay .preview-tools button { background: #fff; }
    #previewOverlay .report-paper { max-width: 1100px; margin: 24px auto 100px; }
    .empty { padding: 34px; text-align: center; color: #688093; }
    @media (max-width: 1050px) { .layout-a, .layout-a.no-nav, .layout-a.no-source { grid-template-columns: minmax(0, 1fr); } .layout-a .nav, .layout-a .source { position: static; max-height: none; } .layout-b.with-drawer, .layout-c .board-top, .layout-c .board-bottom { grid-template-columns: minmax(0, 1fr); } .layout-b .drawer { position: static; } .topbar .tag { display: none; } }
    @media (max-width: 650px) { .field-grid { grid-template-columns: 1fr; } .field-grid .wide { grid-column: auto; } .topbar { padding: 0 10px; gap: 5px; } .topbar strong { font-size: 12px; } .topbar button { padding: 6px; font-size: 11px; } .report-paper { padding: 20px; } }
    @media print { body { background: #fff; } .topbar, .subhead, #switcher, .preview-tools, .report-card button { display: none !important; } #previewOverlay { position: static; overflow: visible; background: #fff; } #previewOverlay .report-paper { margin: 0; max-width: none; box-shadow: none; } .report-card, .gantt-shell { break-inside: avoid; } }
  </style>
</head>
<body>
  <div id="app" class="empty">載入真實週報資料中…</div>
  <div id="switcher" aria-label="Prototype 版型切換"></div>
  <div id="previewOverlay" hidden></div>
  <script>
  // THROWAWAY: Three structurally different variants on one /prototype/weekly-report route.
  const variantNames = { A: '工作台', B: '報告畫布', C: '時程看板' };
  const topicNames = [
    ['summary','本週管理摘要'], ['projects','進行中專案'], ['needs','重要新增需求'],
    ['incidents','重大系統異常'], ['people','人力與組織異動'], ['technology','新技術評估'], ['appendix','工程師來源']
  ];
  let source, state;
  const deep = x => JSON.parse(JSON.stringify(x));
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const plain = value => new DOMParser().parseFromString(String(value ?? ''), 'text/html').body.textContent || '';
  const short = (value, n=260) => { const s=plain(value).trim(); return s.length > n ? s.slice(0,n)+'…' : s; };
  const iso = date => date.toISOString().slice(0,10);
  const plus = (date, days) => { const d=new Date(date+'T12:00:00'); d.setDate(d.getDate()+days); return iso(d); };
  const dayDiff = (a,b) => Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);
  const href = value => /^https?:\/\//i.test(String(value||'')) ? esc(value) : '';
  const selected = () => state.working[state.selected];
  const previousProject = p => source.previous?.sections?.filter(s=>s.type==='project').flatMap(s=>s.projects||[]).find(q=>q.name===p.originalName);
  function mockSchedule(reportDate, index) {
    const shift=index*2;
    return [
      {name:'需求與範圍確認',type:'phase',baseStart:plus(reportDate,-45+shift),baseEnd:plus(reportDate,-26+shift),forecastStart:plus(reportDate,-45+shift),forecastEnd:plus(reportDate,-24+shift)},
      {name:'開發與整合驗證',type:'phase',baseStart:plus(reportDate,-24+shift),baseEnd:plus(reportDate,12+shift),forecastStart:plus(reportDate,-22+shift),forecastEnd:plus(reportDate,19+shift)},
      {name:'使用者驗收',type:'phase',baseStart:plus(reportDate,13+shift),baseEnd:plus(reportDate,37+shift),forecastStart:plus(reportDate,20+shift),forecastEnd:plus(reportDate,44+shift)},
      {name:'正式上線',type:'milestone',baseStart:plus(reportDate,38+shift),baseEnd:plus(reportDate,38+shift),forecastStart:plus(reportDate,45+shift),forecastEnd:plus(reportDate,45+shift)}
    ];
  }
  function prepare(data) {
    source=data;
    const raw=(data.current.sections||[]).filter(s=>s.type==='project').flatMap(s=>s.projects||[]);
    const reportDate=data.current.report_date || '2026-09-24';
    const working=raw.map((p,i)=>({
      id:'project-'+i, originalName:p.name||'未命名專案', name:p.name||'未命名專案',
      target:plain(p.target), status:plain(p.status), health:'待確認', nextStep:'', risk:'',
      progress_items:p.progress_items||[], notes:p.notes||[], schedule:mockSchedule(reportDate,i),
      lastReason:'', lastEdited:'來源複本'
    }));
    const urlVariant=new URL(location.href).searchParams.get('variant');
    const roomy=window.innerWidth>1050;
    state={variant:variantNames[urlVariant]?urlVariant:'A',working,selected:0,topic:'projects',navOpen:roomy,sourceOpen:roomy,
      editing:false,draft:null,saveState:'',previewOpen:false,previewMode:'draft',
      publications:[{version:1,at:'來源複本',projects:deep(working)}],changes:[]};
    render();
  }
  function setVariant(v) {
    state.variant=v;
    const url=new URL(location.href); url.searchParams.set('variant',v); history.replaceState({},'',url);
    render();
  }
  function cycle(delta) { const keys=Object.keys(variantNames); setVariant(keys[(keys.indexOf(state.variant)+delta+keys.length)%keys.length]); }
  function topbar() {
    const date=esc(source.current.report_date||'');
    return `<header class="topbar"><strong>處會週報 · ${date}</strong><span class="tag">THROWAWAY PROTOTYPE · 僅本機</span><span class="spacer"></span>
      <button data-action="toggle-nav" title="收合章節">章節 ${state.navOpen?'▾':'▸'}</button>
      <button data-action="toggle-source" title="收合來源">來源 ${state.sourceOpen?'▾':'▸'}</button>
      <button data-action="preview">全頁預覽</button><button class="primary" data-action="publish">發布測試版 v${state.publications.length+1}</button></header>`;
  }
  function subhead() {
    return `<div class="subhead"><span class="chip blue">三課協作：模擬狀態</span><span>一課 ✓　二課 ✓　三課 ◌</span>
      <span class="muted">來源複本 · ${source.current.pool?.length||0} 筆待分配工作</span><span class="spacer"></span>
      <span>目前測試發布版 v${state.publications.length}</span><button class="small" data-action="reset">重設示範</button></div>`;
  }
  function nav() {
    if (!state.navOpen) return '';
    return `<aside class="panel nav"><div class="panel-header"><h3>報告章節</h3><span class="spacer"></span><button class="small" data-action="toggle-nav">收合</button></div>
      <div class="nav-list">${topicNames.map(([key,label])=>`<button class="${state.topic===key?'active':''}" data-action="topic" data-topic="${key}">${esc(label)}</button>
        ${key==='projects' ? state.working.map((p,i)=>`<button class="indent ${state.topic==='projects'&&state.selected===i?'active':''}" data-action="project" data-index="${i}">${esc(short(p.name,28))}</button>`).join('') : ''}`).join('')}</div></aside>`;
  }
  function sourcePanel() {
    if (!state.sourceOpen) return '';
    const p=selected(), prev=previousProject(p);
    const items=[];
    function collect(rows) { for (const row of rows||[]) { items.push(row); collect(row.children); } }
    collect(p.progress_items);
    return `<aside class="panel source"><div class="panel-header"><h3>上週與 eCIM 來源</h3><span class="spacer"></span><button class="small" data-action="toggle-source">收合</button></div>
      <div class="panel-body"><div class="eyebrow">上週同名專案</div><p class="tiny">${esc(short(prev?.status||'找不到同名專案，需人工確認對應',350))}</p>
      <div class="eyebrow">本週工作線索 · ${items.length} 筆</div>${items.slice(0,9).map(it=>`<div class="source-item"><strong>${esc(short(it.content,90))}</strong><br>
        ${it.work_id?`Work ID ${esc(it.work_id)} · `:''}${esc(it.owner||'')}${it.link_url&&href(it.link_url)?` · <a href="${href(it.link_url)}" target="_blank" rel="noopener">來源</a>`:''}
        ${it.update_note?`<div class="muted">${esc(short(it.update_note,110))}</div>`:''}</div>`).join('')}
      ${items.length>9?`<p class="muted tiny">另有 ${items.length-9} 筆，正式版可展開查看。</p>`:''}</div></aside>`;
  }
  function gantt(p,compact=false) {
    const reportDate=source.current.report_date||'2026-09-24';
    const start=plus(reportDate,-53), end=plus(reportDate,81), total=dayDiff(start,end);
    const pct=date=>Math.max(0,Math.min(100,100*dayDiff(start,date)/total));
    const ticks=[0,27,54,81,108,134].map(n=>`<span style="position:absolute;left:${100*n/total}%;top:7px;color:#617b8d;font-size:10px">${esc(plus(start,n).slice(5))}</span>`).join('');
    const rows=p.schedule.map(s=>{
      const left=pct(s.baseStart), right=pct(s.baseEnd), fleft=pct(s.forecastStart), fright=pct(s.forecastEnd);
      const late=dayDiff(s.baseEnd,s.forecastEnd)>0;
      return `<div class="gantt-line"><div class="gantt-label"><strong>${esc(s.name)}</strong><div class="muted tiny">${esc(s.forecastEnd)}</div></div><div class="gantt-track">
        <div class="gantt-baseline" title="原訂 ${esc(s.baseStart)} ~ ${esc(s.baseEnd)}" style="left:${left}%;width:${Math.max(1,right-left)}%"></div>
        ${s.type==='milestone'?`<div class="gantt-milestone ${late?'late':''}" title="目前預估 ${esc(s.forecastEnd)}" style="left:${fleft}%"></div>`:
          `<div class="gantt-forecast ${late?'late':''}" title="目前預估 ${esc(s.forecastStart)} ~ ${esc(s.forecastEnd)}" style="left:${fleft}%;width:${Math.max(1,fright-fleft)}%"></div>`}
      </div></div>`;
    }).join('');
    return `<div class="gantt-shell"><div class="gantt-inner"><div class="gantt-line"><div class="gantt-label"><strong>${compact?'里程碑概覽':'階段與重要里程碑'}</strong></div><div class="gantt-track">${ticks}</div></div>${rows}</div></div>
      <div class="gantt-legend"><span>■ 灰：計畫基準</span><span>■ 藍：目前預估</span><span>■ 黃：晚於基準</span><span class="muted">示意時程，原週報尚無結構化日期</span></div>`;
  }
  function field(label,key,value,wide=false,multi=false) {
    return `<label class="${wide?'wide':''}">${label}${multi?`<textarea data-field="${key}">${esc(value)}</textarea>`:`<input data-field="${key}" value="${esc(value)}">`}</label>`;
  }
  function editor() {
    if (state.topic!=='projects') return otherTopic();
    const p=selected();
    if (!state.editing) return `<div class="panel"><div class="panel-header"><div><div class="eyebrow">專案項目 · ${state.selected+1}/${state.working.length}</div><h2>${esc(p.name)}</h2></div><span class="spacer"></span><button class="primary" data-action="edit">開始編輯</button></div>
      <div class="panel-body"><div class="toolbar"><span class="chip">${esc(p.health)}</span><span class="muted tiny">${esc(p.lastEdited)}</span><span class="spacer"></span><button class="small" data-action="preview">查看完整週報</button></div>
      <h3>目標</h3><p>${esc(short(p.target,600))||'尚未填寫'}</p><h3>本週現況</h3><p>${esc(short(p.status,750))||'尚未填寫'}</p>
      <h3>專案時程</h3>${gantt(p)}<p class="notice">原始週報有真實專案文字，但沒有甘特圖日期。上方日期僅用於檢查畫面與操作流程。</p></div></div>`;
    const d=state.draft;
    return `<div class="panel"><div class="panel-header"><div><div class="eyebrow">個人暫存草稿 · 模擬項目鎖 30 分鐘</div><h2>${esc(d.name)}</h2></div><span class="spacer"></span><button data-action="cancel-edit">放棄編輯</button><button class="primary" data-action="commit">儲存完成</button></div>
      <div class="panel-body"><div class="toolbar"><span id="saveState" class="chip blue">${esc(state.saveState||'草稿已暫存於記憶體')}</span><span class="muted tiny">其他人仍看到最後儲存的版本</span></div>
      <div class="field-grid" style="margin-top:14px">${field('專案名稱','name',d.name)}<label>健康度<select data-field="health">${['待確認','正常','注意','延遲','暫停','完成'].map(x=>`<option value="${x}" ${d.health===x?'selected':''}>${x}</option>`).join('')}</select></label>
      ${field('專案目標','target',d.target,true,true)}${field('本週現況','status',d.status,true,true)}${field('下週動作','nextStep',d.nextStep,true,true)}${field('風險／需協調','risk',d.risk,true,true)}</div>
      <h3>示意時程資料</h3>${gantt(d,true)}
      ${d.schedule.map((s,i)=>`<div class="phase-form"><strong>${esc(s.name)}</strong><div class="field-grid">
        <label>原訂開始<input type="date" data-phase-index="${i}" data-phase-field="baseStart" value="${esc(s.baseStart)}"></label>
        <label>原訂完成<input type="date" data-phase-index="${i}" data-phase-field="baseEnd" value="${esc(s.baseEnd)}"></label>
        <label>預估開始<input type="date" data-phase-index="${i}" data-phase-field="forecastStart" value="${esc(s.forecastStart)}"></label>
        <label>預估完成<input type="date" data-phase-index="${i}" data-phase-field="forecastEnd" value="${esc(s.forecastEnd)}"></label>
      </div></div>`).join('')}
      ${field('時程變更原因（日期有改動時必填）','lastReason',d.lastReason,true,true)}
      <div class="toolbar"><span class="spacer"></span><button class="primary" data-action="commit">儲存完成</button></div></div></div>`;
  }
  function sourceSectionsFor(topic) {
    const sections=source.current.sections||[];
    if (topic==='needs') return sections.filter(s=>/需求/.test(s.title||'') && s.type!=='table');
    if (topic==='incidents') return sections.filter(s=>/維護|異常/.test(s.title||''));
    if (topic==='people') return sections.filter(s=>/人事/.test(s.title||''));
    if (topic==='technology') return sections.filter(s=>/新技術|研討|訓練/.test(s.title||''));
    if (topic==='appendix') return sections.filter(s=>s.type==='table');
    return [];
  }
  function sourceLines(sec) {
    const out=[];
    for (const sub of sec.sub_sections||[]) {
      out.push({title:sub.title||'',detail:sub.status_desc||'',count:(sub.items||[]).length});
    }
    for (const item of sec.items||sec.list_items||[]) out.push({title:item.content||item.title||String(item),detail:item.update_note||'',count:0});
    return out;
  }
  function otherTopic() {
    const label=topicNames.find(([key])=>key===state.topic)?.[1]||'';
    if (state.topic==='summary') return `<section class="panel"><div class="panel-header"><h2>${label}</h2></div><div class="panel-body"><p class="notice">Prototype 保留既有週報摘要文字供排版檢視；正式系統由 Guy 統整後發布。</p>
      ${(source.current.weekly_focus||[]).map(x=>`<div class="source-item">${esc(plain(x))}</div>`).join('')}</div></section>`;
    const sections=sourceSectionsFor(state.topic);
    return `<section class="panel"><div class="panel-header"><h2>${label}</h2></div><div class="panel-body"><p class="notice">此區沿用原始報告資料供版面檢視；新版項目欄位與權限依設計文件實作。</p>
      ${sections.length?sections.map(sec=>`<div class="report-card"><h3>${esc(sec.title||'')}</h3>${sourceLines(sec).slice(0,18).map(line=>`<div class="source-item"><strong>${esc(short(line.title,100))}</strong> ${line.count?`<span class="muted">· ${line.count} 筆工作</span>`:''}<div class="muted">${esc(short(line.detail,220))}</div></div>`).join('')}</div>`).join(''):'<p class="muted">既有週報沒有直接對應的區塊，新版可由編輯者建立。</p>'}</div></section>`;
  }
  function reportMarkup(projects,versionLabel,interactive=false) {
    const focus=(source.current.weekly_focus||[]).slice(0,5);
    const other=topicNames.filter(([key])=>!['summary','projects'].includes(key)).map(([key,label])=>{
      if (key==='appendix') return `<h2>${esc(label)}</h2><p>本週來源池有 ${source.current.pool?.length||0} 筆待分配工程師工作。工作連結與匯入狀態將由正式系統整理。</p>`;
      const sections=sourceSectionsFor(key);
      return `<h2>${esc(label)}</h2><p class="meta">以下沿用原週報內容作排版示意；正式版由課長確認入選及欄位。</p>
        ${sections.length?sections.map(sec=>`<section class="report-card"><h3>${esc(sec.title||'')}</h3><ul>${sourceLines(sec).slice(0,8).map(line=>`<li><strong>${esc(short(line.title,110))}</strong>${line.detail?`：${esc(short(line.detail,190))}`:''}</li>`).join('')}</ul></section>`).join(''):'<p class="muted">原週報沒有對應區塊。</p>'}`;
    }).join('');
    return `<article class="report-paper"><div class="eyebrow">處會週報 · ${esc(versionLabel)}</div><h1>CIM 處會週報</h1><div class="meta">${esc(source.current.report_date||'')} · ${esc(source.current.period||'')} · 示意排版</div>
      <h2>本週管理摘要</h2><ol>${focus.map(x=>`<li>${esc(plain(x))}</li>`).join('')}</ol>
      <h2>1. 進行中專案進度</h2>${projects.map((p,i)=>`<section class="report-card"><div class="row"><h3>${esc(p.name)}</h3><span class="chip">${esc(p.health)}</span>${interactive?`<button class="small" data-action="project" data-index="${i}">查看／編輯</button>`:''}</div>
        <p><strong>目標：</strong>${esc(short(p.target,270))}</p><p><strong>本週現況：</strong>${esc(short(p.status,330))}</p>
        ${p.nextStep?`<p><strong>下週動作：</strong>${esc(short(p.nextStep,230))}</p>`:''}${p.risk?`<p><strong>風險／需協調：</strong>${esc(short(p.risk,230))}</p>`:''}
        <p class="tiny"><strong>示意上線里程碑：</strong>${esc(p.schedule[p.schedule.length-1].forecastEnd)}</p>
        <details ${i===0?'open':''}><summary>查看階段與里程碑甘特圖</summary>${gantt(p,true)}</details></section>`).join('')}
      ${other}
      <p class="meta">此頁為排版 Prototype。專案名稱與敘述來自真實週報；甘特圖日期僅為示意。重新整理會清除所有試編輯。</p></article>`;
  }
  function variantA() {
    return `<main class="layout-a ${state.navOpen?'':'no-nav'} ${state.sourceOpen?'':'no-source'}">${nav()}<section>${editor()}</section>${sourcePanel()}</main>`;
  }
  function variantB() {
    return `${state.navOpen?`<div class="tabs">${topicNames.map(([key,label])=>`<button class="${state.topic===key?'active':''}" data-action="topic" data-topic="${key}">${esc(label)}</button>`).join('')}</div>`:''}
      <main class="layout-b ${state.editing?'with-drawer':''}"><div>${state.topic==='projects'?reportMarkup(state.working,'工作草稿 · 報告畫布',true):otherTopic()}</div>
      ${state.editing?`<aside class="drawer">${editor()}${state.sourceOpen?`<div style="margin-top:12px">${sourcePanel()}</div>`:''}</aside>`:''}</main>`;
  }
  function variantC() {
    const p=selected();
    return `${state.navOpen?`<div class="tabs">${topicNames.map(([key,label])=>`<button class="${state.topic===key?'active':''}" data-action="topic" data-topic="${key}">${esc(label)}</button>`).join('')}</div>`:''}
      <main class="layout-c">${state.topic==='projects'?`<div class="board-top"><section class="panel"><div class="panel-header"><div><div class="eyebrow">全寬時程看板</div><h2>${esc(p.name)}</h2></div><span class="spacer"></span><button data-action="preview">報告預覽</button></div><div class="panel-body">${gantt(state.editing?state.draft:p)}</div></section>
      <aside class="panel"><div class="panel-header"><h3>專案切換</h3></div><div class="nav-list">${state.working.map((x,i)=>`<button class="${i===state.selected?'active':''}" data-action="project" data-index="${i}">${esc(short(x.name,35))}</button>`).join('')}</div></aside></div>
      <div class="board-bottom"><div>${editor()}</div>${state.sourceOpen?sourcePanel():`<aside class="panel"><div class="panel-body"><button data-action="toggle-source">顯示來源與上週對照</button></div></aside>`}</div>`:otherTopic()}</main>`;
  }
  function render() {
    document.getElementById('app').innerHTML=topbar()+`<div class="shell">`+subhead()+(state.variant==='A'?variantA():state.variant==='B'?variantB():variantC())+`</div>`;
    document.getElementById('switcher').innerHTML=`<button data-action="variant-prev" aria-label="上一種排版">←</button><span>${state.variant} · ${variantNames[state.variant]}　(← → 切換)</span><button data-action="variant-next" aria-label="下一種排版">→</button>`;
    renderPreview();
  }
  function renderPreview() {
    const node=document.getElementById('previewOverlay'); node.hidden=!state.previewOpen;
    if (!state.previewOpen) { node.innerHTML=''; return; }
    const pub=state.publications[state.publications.length-1], published=state.previewMode==='published';
    node.innerHTML=`<div class="preview-tools"><strong>${published?'已發布測試版 v'+pub.version:'工作草稿預覽'}</strong><span class="spacer"></span>
      <button data-action="preview-draft">看草稿</button><button data-action="preview-published">看已發布版</button><button data-action="print">列印</button><button data-action="close-preview">關閉</button></div>
      ${reportMarkup(published?pub.projects:state.working,published?'測試發布版 v'+pub.version:'工作草稿預覽')}`;
  }
  function commit() {
    const old=selected(), d=state.draft;
    const changed=d.schedule.some((s,i)=>['baseStart','baseEnd','forecastStart','forecastEnd'].some(k=>s[k]!==old.schedule[i][k]));
    if (changed && !d.lastReason.trim()) { alert('日期有變動，請填寫時程變更原因。'); return; }
    d.lastEdited='你剛剛儲存的測試變更'; state.working[state.selected]=deep(d);
    state.changes.push({project:d.name,reason:d.lastReason||'內容更新',at:new Date().toLocaleString('zh-TW')});
    state.editing=false; state.draft=null; state.saveState=''; render();
  }
  document.addEventListener('click', e=>{
    const el=e.target.closest('[data-action]'); if (!el || !state) return;
    const action=el.dataset.action;
    if (action==='variant-prev') return cycle(-1);
    if (action==='variant-next') return cycle(1);
    if (action==='reset') return prepare(source);
    if (action==='toggle-nav') { state.navOpen=!state.navOpen; return render(); }
    if (action==='toggle-source') { state.sourceOpen=!state.sourceOpen; return render(); }
    if (action==='topic') { state.topic=el.dataset.topic; state.editing=false; state.draft=null; return render(); }
    if (action==='project') { if(state.editing && !confirm('目前項目尚未按「儲存完成」，要離開嗎？')) return;
      state.selected=Number(el.dataset.index); state.topic='projects'; state.editing=false; state.draft=null; return render(); }
    if (action==='edit') { state.editing=true; state.draft=deep(selected()); state.saveState='草稿已暫存於記憶體'; return render(); }
    if (action==='cancel-edit') { if(confirm('放棄這次試編輯？')) { state.editing=false; state.draft=null; render(); } return; }
    if (action==='commit') return commit();
    if (action==='preview') { state.previewOpen=true; state.previewMode='draft'; return renderPreview(); }
    if (action==='close-preview') { state.previewOpen=false; return renderPreview(); }
    if (action==='preview-draft') { state.previewMode='draft'; return renderPreview(); }
    if (action==='preview-published') { state.previewMode='published'; return renderPreview(); }
    if (action==='print') return window.print();
    if (action==='publish') { if(state.editing) { alert('請先儲存完成目前項目。'); return; }
      state.publications.push({version:state.publications.length+1,at:new Date().toLocaleString('zh-TW'),projects:deep(state.working)});
      state.previewOpen=true; state.previewMode='published'; return render(); }
  });
  let saveTimer;
  document.addEventListener('input', e=>{
    if (!state?.editing) return;
    const field=e.target.dataset.field, index=e.target.dataset.phaseIndex, phaseField=e.target.dataset.phaseField;
    if (field) state.draft[field]=e.target.value;
    else if (index!==undefined && phaseField) state.draft.schedule[Number(index)][phaseField]=e.target.value;
    else return;
    state.saveState='草稿儲存中…'; document.querySelectorAll('#saveState').forEach(n=>n.textContent=state.saveState);
    clearTimeout(saveTimer); saveTimer=setTimeout(()=>{state.saveState='個人草稿已暫存 · '+new Date().toLocaleTimeString('zh-TW');document.querySelectorAll('#saveState').forEach(n=>n.textContent=state.saveState);},400);
  });
  document.addEventListener('change', e=>{ if(state?.editing && e.target.dataset.field==='health') state.draft.health=e.target.value; });
  document.addEventListener('keydown', e=>{
    if (!state || !['ArrowLeft','ArrowRight'].includes(e.key)) return;
    if (e.target.closest('input,textarea,select,[contenteditable]')) return;
    cycle(e.key==='ArrowLeft'?-1:1);
  });
  fetch('/api/data').then(r=>r.json()).then(prepare).catch(err=>{document.getElementById('app').textContent='載入失敗：'+err.message;});
  </script>
</body>
</html>
